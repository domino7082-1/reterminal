
name: Generate Dashboard BMP
run-name: Generate Dashboard BMP (${{ inputs.source || 'ručne' }})

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Zdroj spustenia'
        required: false
        default: 'ručne'

# Zabráni kolízii pri git push, ak by sa 2 behy spustili tesne po sebe
concurrency:
  group: etf-dashboard-update
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 2

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install System Fonts
      run: |
        sudo apt-get update
        sudo apt-get install -y fonts-dejavu

    - name: Install Python dependencies
      run: |
        pip install -r requirements.txt

    - name: Run main dashboard
      run: python main.py

    - name: Run ETF dashboard
      run: python etf_dashboard.py

    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

        # Pridáme oba vygenerované obrázky a JSON so stavom
        git add dashboard_output.bmp etf_output.bmp dashboard_state.json

        # Skontrolujeme, či sú nejaké zmeny; ak nie, končíme
        if git diff --staged --quiet; then
          echo "Žiadne zmeny na uloženie."
          exit 0
        fi

        COMMIT_MSG="Auto-update dashboards [skip ci]"
        LAST_MSG=$(git log -1 --pretty=%s)

        # Ak posledný commit vytvoril bot, prepíšeme ho; inak vytvoríme nový
        if [ "$LAST_MSG" = "$COMMIT_MSG" ]; then
          git commit --amend --date=now -m "$COMMIT_MSG"
          git push --force-with-lease
        else
          git commit -m "$COMMIT_MSG"
          git push
        fi

