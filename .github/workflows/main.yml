name: Generate Dashboard BMP

on:
  workflow_dispatch:

# Zabráni kolízii pri git push, ak by GitHub spustil 2 behy tesne po sebe
concurrency:
  group: etf-dashboard-update
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install System Fonts
      run: |
        sudo apt-get update
        sudo apt-get install -y fonts-dejavu

    - name: Install Python dependencies
      run: |
        pip install -r requirements.txt

    - name: Run main dashboard
      run: python main.py

    - name: Run ETF dashboard
      run: python etf_dashboard.py

    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

        # Pridáme oba vygenerované obrázky a JSON so stavom
        git add dashboard_output.bmp etf_output.bmp dashboard_state.json

        # Skontrolujeme, či sú nejaké zmeny, ak nie, končíme
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update dashboards [skip ci]" && git push)
